<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote 독서노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 스프링 노트 한 권. 상단 탭으로 화면 전환, 본문은 화면마다 2단(책 카드 + 기록 / 달력 + 사이드). 종이 질감 단일 테마. */
:root{
  --desk:#EDE7DB; --paper:#FBF8F1; --card:#FFFEFB; --ink:#2B2B2B; --sub:#6F695D; --line:#E4DECF; --red:#D9534F; --blue:#5B7BD5;
  --mint:#BFE6DA; --mint-d:#3E9E82; --lav:#D9CCF0; --lav-d:#7C63C6; --peach:#F6CDB5; --peach-d:#D4753F;
  --pink:#F4C6CC; --pink-d:#CC6F80; --yellow:#F4E2A0; --yellow-d:#B8932A;
  --sky:#C9DDF4; --sky-d:#4B7DB8; --lime:#D5E8B0; --lime-d:#6E9A2F; --plum:#E7C3E6; --plum-d:#A24FA0; --sand:#E5D5B8; --sand-d:#9A7B3E; --gray:#DDD9D0; --gray-d:#807A6C;
  --hand:'Gaegu','Noto Sans KR',cursive; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--desk);color:var(--ink);font:400 14px/1.6 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1380px;margin:0 auto;padding:30px 16px 48px;position:relative}
.rings{position:absolute;top:12px;left:0;right:0;display:flex;gap:12px;justify-content:center;overflow:hidden;z-index:3;pointer-events:none}
.ring{flex:none;width:14px;height:34px;border-radius:7px;background:#D8D2C5;border:1px solid #8E8878}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(64,51,26,.16);padding:58px 36px 32px;min-height:820px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.title h1{font:700 44px/1 var(--hand)}
.title .sub{font:400 20px/1.2 var(--hand);color:var(--sub)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 18px;color:var(--sub);font-weight:500}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sample{font-size:12px;color:var(--sub);border:1px dashed var(--sub);border-radius:999px;padding:2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.label{font:400 16px/1.3 var(--hand);color:var(--sub);display:block}
.soft{color:var(--sub);font-size:12px}
.sp{flex:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;border-radius:0}
.field:focus{outline:none;border-bottom-color:var(--ink)}
textarea.field{resize:vertical;min-height:56px;line-height:1.6;display:block}
.t28{font:700 28px/1.25 var(--hand)}
.t22{font:700 22px/1.3 var(--hand)}
.primary{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:500}
.ghostbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;color:var(--ink)}
.ghostbtn:hover{border-color:var(--ink)}
.ib{background:transparent;border:0;border-radius:8px;padding:4px 8px;color:var(--sub);font-size:13px}
.ib:hover{background:var(--line);color:var(--ink)}
.mk{background:linear-gradient(transparent 38%,var(--c,var(--mint)) 38%,var(--c,var(--mint)) 94%,transparent 94%);padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
i.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--cd,var(--mint-d));flex:none}

/* 독서 노트 */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.bchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 10px}
.bchip.on{background:var(--c);border-color:var(--cd)}
.bchip.done{opacity:.7}
.note{display:grid;grid-template-columns:440px minmax(0,1fr);gap:28px;align-items:start}
.bookcard{display:flex;flex-direction:column;gap:16px}
.bookcard hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;line-height:1}
.stepper button.plus{background:var(--ink);color:#fff;border-color:var(--ink)}
.bestq{background:var(--c);border-radius:14px;padding:16px 18px}
.bestq p{font:700 22px/1.35 var(--hand)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%;background:var(--cd);border-radius:4px}
.pd{margin-top:2px}
.pdgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pdt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.pdt small{display:block;font-size:11px;color:var(--sub);letter-spacing:.04em}
.pdt b{font:700 21px/1.25 var(--hand);display:block;overflow-wrap:anywhere}
.pdt em{font-style:normal;font-size:11px;color:var(--sub);display:block;line-height:1.35}
.pbars{display:flex;align-items:flex-end;gap:3px;height:48px;margin-top:10px;border-bottom:1px solid var(--ink)}
.pbars span{flex:1;height:100%;display:flex;align-items:flex-end}
.pbars i{display:block;width:100%;background:var(--cd);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.pbars .now i{background:var(--red);opacity:1}
.pblab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:3px}
.memopad{margin-top:22px}
.sticky{position:relative;background:#F8EBA8;padding:26px 18px 16px;box-shadow:0 3px 9px rgba(64,51,26,.2);transform:rotate(-.5deg);margin-top:14px}
.sticky:before{content:"";position:absolute;top:-11px;left:50%;width:90px;height:22px;margin-left:-45px;background:rgba(244,198,204,.85);transform:rotate(1.5deg)}
.sticky-ta{display:block;width:100%;min-height:170px;border:0;background:repeating-linear-gradient(transparent 0 29px,rgba(120,100,40,.22) 29px 30px);font:400 21px/30px var(--hand);color:var(--ink);resize:vertical;padding:0}
.sticky-ta:focus{outline:none}
.sticky-ta::placeholder{color:rgba(43,43,43,.5)}
.q1{font:700 18px/1.4 var(--hand)}
.qlog{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entries{display:flex;flex-direction:column;gap:14px;min-width:0}
.ehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ehead h2{font:700 28px/1 var(--hand)}
.entry{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.erow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pg{background:var(--c);border-radius:999px;padding:1px 12px;font-weight:500;font-size:12px}
.chip2{border:1px solid var(--cd);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--sub)}
.chip2.star{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.entry .q{font:700 22px/1.45 var(--hand)}
.hint{border:1px dashed var(--line);border-radius:16px;padding:16px 20px;text-align:center;color:var(--sub);background:transparent;width:100%}
.hint:hover{border-color:var(--ink);color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}

/* 월간 */
.month{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.mtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.tape{font:700 52px/1.1 var(--hand);padding:0 16px;background:repeating-linear-gradient(135deg,#F4C6CC 0 6px,#FADFE2 6px 12px)}
.mtop .ym{font:700 22px/1.2 var(--hand);color:var(--red);letter-spacing:.1em}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--ink)}
.wd{font-size:11px;letter-spacing:.14em;color:var(--sub);text-align:center;padding:6px 0}
.wd.sat{color:var(--blue)}.wd.sun{color:var(--red)}
.cell{min-height:108px;border:0;background:transparent;text-align:left;padding:6px 8px 8px;border-right:1px dashed var(--line);border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:hover{background:rgba(244,198,204,.22)}
.cell.out .dn{opacity:.35}
.dn{font:400 22px/1 var(--hand);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.cell.sat .dn{color:var(--blue)}.cell.sun .dn{color:var(--red)}
.cell.today{background:rgba(244,198,204,.35)}
.cell.today .dn{border:2px solid var(--red);color:var(--red)}
.li{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0;line-height:1.3}
.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.li b{font-weight:500;color:var(--sub)}
.li i.dot{width:8px;height:8px}
.cellfoot{margin-top:auto;display:flex;align-items:center;gap:6px}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);flex:1}
.seg span{background:var(--cd)}
.tot{font-size:11px;color:var(--sub)}
.side{display:flex;flex-direction:column;gap:26px}
.sh{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.14em;margin-bottom:10px}
.sh:after{content:"";flex:1;border-top:1px solid var(--ink)}
.sh span{background:linear-gradient(transparent 50%,var(--mint) 50%);padding:0 6px}
.sh.p span{background:linear-gradient(transparent 50%,var(--lav) 50%)}
.sh.y span{background:linear-gradient(transparent 50%,var(--yellow) 50%)}
.goal{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line);font:400 19px/1.3 var(--hand)}
.goal input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.goal.done span{text-decoration:line-through;color:var(--sub)}
.goalform input{width:100%;border:0;border-bottom:1px dotted var(--line);background:transparent;padding:6px 0;font:400 19px/1.3 var(--hand)}
.habit{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:6px 10px;font-size:13px}
.dots{display:flex;gap:1px;flex-wrap:nowrap}
.dots i{width:6px;height:6px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent}
.dots i.on{background:var(--mint-d);border-color:var(--mint-d)}
.dots i.on2{background:var(--peach-d);border-color:var(--peach-d)}
.dots i.now{outline:2px solid var(--red);outline-offset:1px}
.memo{width:100%;min-height:120px;border:0;background:repeating-linear-gradient(transparent 0 29px,var(--line) 29px 30px);font:400 19px/30px var(--hand);resize:vertical;padding:0}
.memo:focus{outline:none}

/* 주간·일간 */
.wnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.wnav h2{font:700 30px/1 var(--hand);margin:0 6px}
.wsum{display:flex;gap:24px;color:var(--sub);flex-wrap:wrap;margin-left:auto}
.wsum b{color:var(--ink);font:700 22px/1 var(--hand)}
.wcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.wcol{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.wcol:hover{border-color:var(--ink)}
.wcol.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.wcol .dh{display:flex;justify-content:space-between;align-items:baseline}
.wcol .dh b{font:700 24px/1 var(--hand)}
.vbar{height:150px;display:flex;flex-direction:column-reverse;justify-content:flex-start;background:repeating-linear-gradient(transparent 0 37px,var(--line) 37px 38px);border-radius:6px;overflow:hidden}
.vbar span{background:var(--cd);display:block;border-top:1px solid var(--card)}
.day{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
.logrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line)}
.logform{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.logform select,.logform input{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.logform input{width:84px}
.qcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.qcard:hover{border-color:var(--ink)}
.qcard .q{font:700 20px/1.4 var(--hand)}

/* 개요 */
.ov{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px 32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:4px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{padding:12px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat small{display:block;font-size:11px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase}
.stat b{font:700 44px/1.05 var(--hand)}
.stat em{font-style:normal;font-size:12px;color:var(--sub);display:block}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--ink);padding-top:22px;background:repeating-linear-gradient(transparent 0 49px,var(--line) 49px 50px)}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative}
.bar .stack{display:flex;flex-direction:column-reverse}
.bar .stack span{background:var(--cd);border-top:1px solid var(--paper)}
.bar em{display:block;text-align:center;font:700 15px/1 var(--hand);font-style:normal;color:var(--sub);padding-bottom:3px;min-height:18px}
.blabels{display:flex;gap:10px;margin-top:6px}
.blabels span{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.blabels span.now{color:var(--red);font-weight:700}
.hl{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--line)}
.hl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 18px/1.3 var(--hand)}
.hl .b{height:14px;border-radius:3px;background:var(--c);min-width:4px}
.hl b{text-align:right;font:700 16px/1 var(--hand)}
.wavg{display:flex;align-items:flex-end;gap:10px;height:130px;border-bottom:1px solid var(--ink)}
.wavg div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.wavg i{display:block;width:100%;background:var(--pink);border-radius:3px 3px 0 0}
.wavg span{font-size:11px;color:var(--sub)}
.wavg .max i{background:var(--pink-d)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hc{aspect-ratio:1.25;border-radius:6px;border:1px dashed var(--line);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;color:var(--sub)}
.hc b{font-weight:500}
.hc.l1{background:rgba(62,158,130,.2);border:0;color:var(--ink)}
.hc.l2{background:rgba(62,158,130,.38);border:0;color:var(--ink)}
.hc.l3{background:rgba(62,158,130,.6);border:0;color:var(--ink)}
.hc.l4{background:rgba(62,158,130,.88);border:0;color:#fff}
.hc.fut{opacity:.35}.hc.td{outline:2px solid var(--red);outline-offset:1px}
.heatwd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;color:var(--sub);text-align:center;margin-bottom:4px}

/* 내 책장 */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:#fff}
.tools select{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff}
.today-q{background:var(--yellow);border-radius:16px;padding:18px 22px;margin-bottom:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.today-q .q{font:700 26px/1.35 var(--hand);flex:1;min-width:240px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.sc{display:flex;flex-direction:column;gap:10px;position:relative;padding-top:26px}
.sc:before{content:"";position:absolute;top:-6px;left:18px;width:70px;height:18px;background:var(--c);opacity:.85;transform:rotate(-3deg)}
.sc .q{font:700 22px/1.4 var(--hand)}
.sc .meta{font-size:12px;color:var(--sub)}
.sc .th{font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.sc .acts{display:flex;gap:4px;margin-top:auto}
mark{background:var(--yellow);color:inherit;padding:0 1px}

/* 칩 순서 바꾸기 · 언어 · 분야 · 인생책 · 책 상세 */
.bchip[draggable=true]{cursor:grab}
.bchip.dragging{opacity:.4}
.bchip.over{outline:2px dashed var(--ink);outline-offset:2px}
.bsel{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0}
.mv{border:0;background:transparent;padding:0 4px;color:var(--sub);font-size:16px;line-height:1;border-radius:6px}
.mv:hover{color:var(--ink);background:var(--line)}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;color:var(--sub);font-size:12px;letter-spacing:.06em}
.lang:hover{border-color:var(--ink);color:var(--ink)}
.cvg{position:absolute;left:24px;bottom:10px;background:rgba(255,254,251,.9);border-radius:999px;font-size:11px;padding:0 8px;line-height:1.7;color:var(--ink)}
.cvh{position:absolute;top:8px;left:22px;font-size:17px;line-height:1;color:var(--red)}
.life-h{color:var(--red)}
.bkhead{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:20px}
.bkinfo h2{font:700 32px/1.2 var(--hand);overflow-wrap:anywhere}
.bkinfo p{margin:2px 0}
.bkdesc{margin-top:6px;min-height:78px}
.gsel{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff}
.qlist{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.qrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:6px 20px;padding:14px 4px;border-bottom:1px dotted var(--line);align-items:start}
.qrow .qpg{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qrow .q{font:700 22px/1.45 var(--hand)}
.qrow .th{font-size:13px;color:var(--sub);margin-top:4px}
.qrow .qm{font-size:12px;color:var(--sub)}
.qrow .acts{display:flex;gap:2px;align-items:center}
@media (max-width:720px){.bkhead{grid-template-columns:1fr}.qrow{grid-template-columns:1fr}}

/* 모달·토스트 */
.scrim{position:fixed;inset:0;background:rgba(43,43,43,.4);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.modal{width:min(640px,100%);display:flex;flex-direction:column;gap:12px;max-height:94vh;overflow:auto}
.modal h2{font:700 28px/1.1 var(--hand)}
.modal h2 small{font:400 16px var(--body);color:var(--sub);margin-left:8px}
.modal input[type=number],.modal input[type=text],.modal input[type=date],.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.modal textarea{min-height:76px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
fieldset{border:0;padding:0;margin:0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
legend{padding:0;float:left;margin-right:8px}
.typebox{display:grid;border:1px solid var(--line);border-radius:10px;background:#fff}
.typebox:focus-within{outline:2px solid var(--ink)}
.ghost,.typebox textarea{grid-area:1/1;font:700 22px/1.6 var(--hand);padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:0;min-height:96px}
.typebox textarea{background:transparent;color:transparent;caret-color:var(--ink);border:0;resize:none;outline:none;overflow:hidden}
.g-todo{color:#B3AB9B}.g-ok{color:var(--ink)}.g-bad{color:var(--red);text-decoration:underline wavy}
.err{color:var(--red);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.sh.plain span{background:none;padding:0}
.datebig{font:700 52px/1 var(--hand);letter-spacing:.02em;background:linear-gradient(transparent 64%,#F4C6CC 64%)}
.datebig b{color:var(--red)}
.dayone{max-width:820px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}.stack[hidden]{display:none}
.wtop{display:grid;grid-template-columns:auto 1fr auto auto;border:1px solid var(--line);border-radius:4px;margin-bottom:14px;align-items:stretch;background:var(--card)}
.wlabel{font-size:11px;letter-spacing:.14em;color:var(--sub);padding:10px 20px;border-right:1px solid var(--line);display:flex;align-items:center;white-space:nowrap}
.wgoal{border:0;background:transparent;font:400 24px/1.3 var(--hand);padding:6px 14px;min-width:0;width:100%}
.wgoal:focus{outline:none;background:rgba(244,198,204,.18)}
.wtop .wlabel:nth-of-type(2){border-left:1px solid var(--line)}
.stars{display:flex;align-items:center;gap:4px;padding:0 14px}
.stars button{border:0;background:transparent;font-size:22px;line-height:1;color:var(--yellow-d);padding:2px}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:26px 22px;margin-top:6px}
.cover{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:0;width:150px}
.cv{position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px;width:100%;aspect-ratio:3/4;border-radius:6px 12px 12px 6px;background:var(--c);padding:16px 12px 16px 26px;box-shadow:0 4px 10px rgba(64,51,26,.18);overflow:hidden;margin-bottom:6px}
.cv:before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--cd);opacity:.9}
.cvt{font:700 22px/1.25 var(--hand);background:rgba(255,254,251,.88);padding:4px 8px;border-radius:4px;overflow-wrap:anywhere}
.cva{font-size:12px}
.cvb{position:absolute;top:10px;right:10px;background:rgba(43,43,43,.82);color:#fff;border-radius:999px;font-size:11px;padding:0 8px;line-height:1.7}
.cvn{font-weight:700;font-size:14px;line-height:1.3}
.cover:hover .cv{box-shadow:0 8px 16px rgba(64,51,26,.24)}
.cover.add .cv{background:transparent;border:2px dashed var(--sub);box-shadow:none;align-items:center;justify-content:center;border-radius:12px;padding:0}
.cover.add .cv:before{display:none}
.plusbig{font:400 44px/1 var(--hand);color:var(--sub)}
.tag{display:inline-block;background:var(--c);color:var(--ink);border-radius:6px;padding:1px 9px;font:500 12px/1.6 var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0}
.tag.lg{font-size:13px;padding:3px 12px;border-radius:8px}
.tag.lg:hover{outline:2px solid var(--cd)}
.wtags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wrow .tag{flex:1;min-width:0;width:auto}
.wcol2{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:10px 12px 8px;display:flex;flex-direction:column;min-width:0}
.wh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.wh .dt{font:700 30px/1 var(--hand);border:0;background:transparent;padding:0;color:var(--ink)}
.wh .dt:hover{text-decoration:underline}
.wh .dt.today{background:linear-gradient(transparent 62%,#F4C6CC 62%)}
.wname{font-size:10px;letter-spacing:.14em;color:var(--sub)}.wname.sat{color:var(--blue)}.wname.sun{color:var(--red)}
.wrow{display:flex;align-items:center;gap:6px;height:36px;border:0;border-bottom:1px solid var(--line);font:400 19px/1 var(--hand);min-width:0;width:100%;text-align:left;background:transparent;padding:0;color:var(--ink)}
.wrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wrow b{font:700 18px/1 var(--hand);flex:none}
.wrow i.dot{width:9px;height:9px}
.wrow.q{cursor:pointer}.wrow.q:hover{background:rgba(244,198,204,.2)}
.wtot{display:flex;align-items:baseline;justify-content:center;gap:2px;margin-top:6px;border-top:2px solid var(--ink);padding-top:6px;font:700 32px/1.1 var(--hand);min-height:46px}
.wtot small{font:700 14px var(--hand);color:var(--sub)}
.foot{margin-top:28px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.foot button{background:none;border:0;text-decoration:underline;color:var(--sub);padding:0}

@media (max-width:1060px){.month,.ov,.day{grid-template-columns:1fr}.note{grid-template-columns:1fr}.wcols{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* 좁은 창: 스프링이 왼쪽으로 옮겨 가는 세로 노트. 카드는 줄 노트처럼 평평해진다. */
@media (max-width:760px),(orientation:portrait) and (max-width:900px){
  .wrap{padding:0}
  .paper{border-radius:0;border:0;box-shadow:none;min-height:100vh;padding:22px 16px 28px 56px}
  .rings{top:16px;bottom:16px;left:8px;right:auto;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:12px}
  .ring{width:34px;height:14px}
  .head{margin-bottom:16px}
  .title h1{font-size:38px}
  .bookcard,.entry{background:transparent;border:0;border-radius:0;padding:0 0 14px;border-bottom:1px solid var(--ink)}
  .entry{border-bottom-color:var(--line)}
  .qcard,.wcol{background:transparent}
}
@media (max-width:720px){
  .wtop{grid-template-columns:auto 1fr}.wtop .wlabel:nth-of-type(2){border-left:0;border-top:1px solid var(--line)}.stars{border-top:1px solid var(--line)}
  .title h1{font-size:36px}
  .wcols{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cell{min-height:78px;padding:4px}.li span,.li b{display:none}.tape{font-size:38px}
  .hl{grid-template-columns:90px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

function bookStats(b){
  const es=entriesOf(b.id),done=bookPages(b.id),rem=Math.max(0,b.total-done);
  const per=[];for(let i=13;i>=0;i--){const d=addDays(TODAY,-i);per.push({d:d,p:logsOn(d).filter(l=>l.b===b.id).reduce((a,l)=>a+l.p,0)});}
  const w7=per.slice(7).reduce((a,x)=>a+x.p,0),p14=per.reduce((a,x)=>a+x.p,0),pace=p14/14;
  const days=getLogs().filter(l=>l.b===b.id&&l.p>0).length;
  const last=es.slice().sort((x,y)=>(x.createdAt+(x.createdTime||''))<(y.createdAt+(y.createdTime||''))?1:-1)[0];
  const eta=rem>0&&pace>0?addDays(TODAY,Math.ceil(rem/pace)):null;
  const since=Math.max(1,Math.round((parse(TODAY)-parse(b.started))/864e5)+1);
  return {done,rem,per,w7,days,last,eta,since,avg:days?Math.round(done/days*10)/10:0,etaIn:eta?Math.round((parse(eta)-parse(TODAY))/864e5):null};
}

  const names=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'],reading=D.books.filter(b=>b.status==='reading');
  let cols='',tp=0,days=0,en=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),lg=logsOn(d),tot=lg.reduce((a,l)=>a+l.p,0);
    const es=D.entries.filter(e=>e.createdAt===d).sort(cmpEntry);
    tp+=tot;if(tot)days++;en+=es.length;
    const rows=[];
    lg.forEach(l=>{const b=bookById(l.b);rows.push('<div class="wrow" style="'+bs(b)+'"><span class="tag" title="'+esc(b.title)+'">'+esc(b.title)+'</span><b>'+l.p+tr('쪽')+'</b></div>');});
    es.forEach(e=>rows.push('<button class="wrow q" data-a="openEntry" data-id="'+e.id+'" style="'+bs(bookById(e.bookId))+'" title="'+esc(e.quote)+'"><span>✎ '+esc(e.quote)+'</span></button>'));
    while(rows.length<9)rows.push('<div class="wrow"></div>');
    cols+='<div class="wcol2" role="group" aria-label="'+fmtKo(d)+'"><div class="wh"><button class="dt'+(d===TODAY?' today':'')+'" data-a="goDay" data-d="'+d+'" aria-label="'+fmtKo(d)+tr(' 일간으로')+'">'+md(d)+'</button><span class="wname'+(i===5?' sat':'')+(i===6?' sun':'')+'">'+names[i]+'</span></div>'+rows.join('')+'<div class="wtot">'+(tot?tot:'')+'<small>'+(tot?tr('쪽'):'')+'</small></div></div>';
  }
  const star=[1,2,3,4,5].map(n=>'<button type="button" data-a="wstar" data-n="'+n+'" aria-label="'+n+tr('점')+'" aria-pressed="'+(stars>=n)+'">'+(stars>=n?'★':'☆')+'</button>').join('');
  return '<div class="wnav"><button class="ghostbtn" data-a="wPrev" aria-label="'+tr('이전 주')+'">‹</button><h2>'+md(ws)+' – '+md(we)+'</h2><button class="ghostbtn" data-a="wNext" aria-label="'+tr('다음 주')+'">›</button><button class="ghostbtn" data-a="wToday">'+tr('이번 주')+'</button>'+
    '<div class="wsum"><span><b>'+tp+'</b>'+tr(' 쪽')+'</span><span><b>'+days+'</b>'+tr(' 일 읽음')+'</span><span><b>'+en+'</b>'+tr(' 인용구')+'</span></div></div>'+
    '<div class="wtags" role="group" aria-label="'+tr('지금 읽고 있는 책')+'"><span class="soft">'+tr('읽는 중')+'</span>'+(reading.length?reading.map(b=>{let wp=0;for(let k=0;k<7;k++)logsOn(addDays(ws,k)).forEach(l=>{if(l.b===b.id)wp+=l.p;});return '<button class="tag lg" data-a="book" data-go="note" data-id="'+b.id+'" style="'+bs(b)+'">'+esc(b.title)+(wp?' · '+wp+tr('쪽'):'')+'</button>';}).join(''):'<span class="soft">'+tr('읽는 중인 책이 없어요')+'</span>')+'</div>'+
    '<div class="wtop"><span class="wlabel">MY GOAL</span><input class="wgoal" data-f="weekgoal" value="'+esc(goal)+'" placeholder="'+tr('이번 주 독서 목표')+'" aria-label="'+tr('주간 목표')+'"><span class="wlabel">REVIEW OF THE WEEK</span><div class="stars" role="group" aria-label="'+tr('주간 회고 별점')+'">'+star+'</div></div>'+
    '<div class="wcols">'+cols+'</div>';

function overviewView(){
  const wk=mondayOf(TODAY),mStart=TODAY.slice(0,8)+'01';
  const weekTot=sumRange(wk,addDays(wk,6)),monthTot=sumRange(mStart,TODAY);
  let sum30=0,rec=0;for(let i=29;i>=0;i--){const p=pagesOn(addDays(TODAY,-i));sum30+=p;if(p)rec++;}
  let streak=0,sd=pagesOn(TODAY)>0?TODAY:addDays(TODAY,-1);while(pagesOn(sd)>0){streak++;sd=addDays(sd,-1);}
  const monthRec=(()=>{let c=0;for(let d=mStart;d<=TODAY;d=addDays(d,1))if(pagesOn(d))c++;return c;})();
  const weeks=[];for(let i=11;i>=0;i--){const s=addDays(wk,-7*i),per={};let t=0;for(let k=0;k<7;k++)logsOn(addDays(s,k)).forEach(l=>{per[l.b]=(per[l.b]||0)+l.p;t+=l.p;});weeks.push({s,per,t});}
  const mx=Math.max(60,Math.ceil(Math.max.apply(null,weeks.map(w=>w.t))/10)*10);
  const bars=weeks.map(w=>'<div class="bar"><em>'+(w.t||'')+'</em><div class="stack" style="height:'+(w.t/mx*100)+'%">'+Object.keys(w.per).map(id=>'<span style="'+bs(bookById(id))+';flex:'+w.per[id]+'"></span>').join('')+'</div></div>').join('');
  const labels=weeks.map((w,i)=>'<span'+(i===11?' class="now"':'')+'>'+(i===11?tr('이번 주'):md(w.s))+'</span>').join('');
  const mb={};for(let d=mStart;d<=TODAY;d=addDays(d,1))logsOn(d).forEach(l=>{mb[l.b]=(mb[l.b]||0)+l.p;});
  const mbk=Object.keys(mb).sort((a,b)=>mb[b]-mb[a]),mbMax=Math.max(1,mb[mbk[0]]||1);
  const hl=mbk.map(id=>{const b=bookById(id);return '<div class="hl" style="'+bs(b)+'"><span class="nm">'+esc(b.title)+'</span><span><span class="b" style="display:block;width:'+(mb[id]/mbMax*100)+'%"></span></span><b>'+mb[id]+tr('쪽')+'</b></div>';}).join('')||'<p class="soft">'+tr('이번 달 기록이 없어요.')+'</p>';
  const wsum=[0,0,0,0,0,0,0];for(let i=0;i<56;i++){const d=addDays(TODAY,-i);wsum[(parse(d).getDay()+6)%7]+=pagesOn(d);}
  const wavg=wsum.map(v=>v/8),wm=Math.max.apply(null,wavg),wmaxI=wavg.indexOf(wm);
  const wbars=wavg.map((v,i)=>'<div class="'+(i===wmaxI?'max':'')+'"><span>'+(Math.round(v*10)/10)+'</span><i style="height:'+(v/(wm||1)*100)+'%"></i></div>').join('');
  const wlab=WKD().map(x=>'<span>'+x+'</span>').join('');
  const g0=addDays(wk,-28);let heat='';
  for(let i=0;i<35;i++){const d=addDays(g0,i),p=pagesOn(d),fut=d>TODAY;const lv=p===0?'':p<=5?'l1':p<=10?'l2':p<=20?'l3':'l4';
    heat+='<div class="hc '+lv+(fut?' fut':'')+(d===TODAY?' td':'')+'" title="'+fmtKo(d)+' '+p+tr('쪽')+'"><span>'+parse(d).getDate()+'</span>'+(p?'<b>'+p+'</b>':'')+'</div>';}
  const total=D.entries.length,withTh=D.entries.filter(e=>norm(e.thought)).length,typed=D.entries.filter(e=>e.typed).length;
  const pctF=n=>total?Math.round(n/total*100):0;
  return '<div class="ov"><div><h3 class="sh"><span>OVERVIEW</span></h3>'+
    '<div class="stats"><div class="stat"><small>'+tr('이번 주')+'</small><b>'+weekTot+tr('쪽')+'</b><em>'+md(wk)+' – '+md(addDays(wk,6))+'</em></div><div class="stat"><small>'+tr('이번 달')+'</small><b>'+monthTot+tr('쪽')+'</b><em>'+md(mStart)+tr('부터')+'</em></div><div class="stat"><small>'+tr('하루 평균')+'</small><b>'+(rec?Math.round(sum30/rec*10)/10:0)+tr('쪽')+'</b><em>'+tr('최근 30일 읽은 날 기준')+'</em></div><div class="stat"><small>'+tr('기록한 날')+'</small><b>'+monthRec+' / 30</b><em>'+tr('이번 달에 읽은 날')+'</em></div></div></div>'+
    '<div><h3 class="sh p"><span>STREAK</span></h3><div class="stats two"><div class="stat"><small>'+tr('연속 기록')+'</small><b>'+streak+tr('일')+'</b><em>'+tr('오늘까지 이어서 기록')+'</em></div><div class="stat"><small>'+tr('달성률')+'</small><b>'+Math.round(rec/30*100)+'%</b><em>'+tr('최근 30일 중 1쪽 이상 읽은 날')+'</em></div></div></div>'+
    '<div><h3 class="sh"><span>LAST 12 WEEKS</span></h3><div class="bars">'+bars+'</div><div class="blabels">'+labels+'</div></div>'+
    '<div><h3 class="sh y"><span>HIGHLIGHTERS</span></h3>'+hl+'<p class="soft" style="margin-top:6px">'+tr('이번 달 책별 읽은 쪽수')+'</p></div>'+
    '<div><h3 class="sh p"><span>WEEKDAYS</span></h3><div class="wavg">'+wbars+'</div><div class="heatwd" style="margin-top:4px">'+wlab+'</div><p class="soft">'+tr('요일별 평균 쪽수 · 지난 8주')+'</p></div>'+
    '<div><h3 class="sh"><span>LAST 35 DAYS</span></h3><div class="heatwd">'+WKD().map(x=>'<span>'+x+'</span>').join('')+'</div><div class="heat">'+heat+'</div></div>'+
    '<div style="grid-column:1/-1"><h3 class="sh y"><span>QUOTE SUMMARY</span></h3><div class="stats"><div class="stat"><small>'+tr('남긴 인용구')+'</small><b>'+total+tr('개')+'</b><em>'+tr('책 ')+D.books.length+tr('권')+'</em></div><div class="stat"><small>'+tr('내 생각을 남긴 비율')+'</small><b>'+pctF(withTh)+'%</b><em>'+withTh+' / '+total+tr('개')+'</em></div><div class="stat"><small>'+tr('따라쓰기 비율')+'</small><b>'+pctF(typed)+'%</b><em>'+typed+' / '+total+tr('개')+'</em></div><div class="stat"><small>'+tr('읽는 중')+'</small><b>'+D.books.filter(b=>b.status==='reading').length+tr('권')+'</b><em>'+tr('병렬독서')+'</em></div></div></div></div>';
}

function hi(text,q){const t=esc(text);if(!q)return t;const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return t.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>');}
function shelfList(){
  const sh=S.shelf,q=norm(sh.q).toLowerCase();
  let es=D.entries.filter(e=>(sh.book==='all'||e.bookId===sh.book)&&(!q||(e.quote+' '+e.thought+' '+(e.chapter||'')+' '+bookById(e.bookId).title+' '+bookById(e.bookId).author).toLowerCase().indexOf(q)>=0));
  if(sh.sort==='book')es.sort(cmpEntry);
  else if(sh.sort==='shuffle'){let r=sh.seed+7;const rn=()=>(r=(r*1664525+1013904223)%4294967296)/4294967296;es=es.map(e=>[rn(),e]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
  else es.sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  return es;
}

function coverHTML(b,st){
  const n=entriesOf(b.id).length,pct=b.status==='done'?100:Math.min(100,Math.round(bookPages(b.id)/b.total*100)),g=genreOf(b.genre);
  const inner='<span class="cv">'+(b.life?'<span class="cvh" aria-hidden="true">♥</span>':'')+'<span class="cvb">'+(b.status==='done'?tr('완독'):tr('읽는 중'))+'</span><span class="cvt">'+esc(b.title)+'</span><span class="cva">'+esc(b.author)+'</span>'+(g?'<span class="cvg">'+esc(gName(g))+'</span>':'')+'</span>';
  if(st)return '<div class="cover" style="'+bs(b)+'">'+inner+'</div>';
  return '<button class="cover" data-a="shelfBook" data-id="'+b.id+'" style="'+bs(b)+'" aria-label="'+esc(b.title)+tr(' 인용구 보기')+'">'+inner+'<span class="cvn">'+esc(b.title)+'</span><span class="soft">'+qn(n)+' · '+(b.status==='done'?tr('완독'):pct+'%')+'</span></button>';
}
const BIG=30,DONE_MAX=24;
const bigShelf=()=>D.books.length>BIG;
function sortBooks(l){
  const m=S.shelf.bsort,a=l.slice();
  if(m==='recent'){const k={};a.forEach(b=>{k[b.id]=entriesOf(b.id).reduce((mx,e)=>{const v=e.createdAt+(e.createdTime||'');return v>mx?v:mx;},'')||b.started;});a.sort((x,y)=>k[y.id]<k[x.id]?-1:k[y.id]>k[x.id]?1:0);}
  else if(m==='title')a.sort((x,y)=>x.title.localeCompare(y.title,LANG==='en'?'en':'ko'));
  else if(m==='genre'){const gi=b=>{const n=GENRES.findIndex(g=>g.id===b.genre);return n<0?99:n;};a.sort((x,y)=>gi(x)-gi(y));}
  return a;
}
function shelfCovers(){
  const all=sortBooks(D.books.filter(b=>S.shelf.genre==='all'||b.genre===S.shelf.genre));
  const life=all.filter(b=>b.life),rest=all.filter(b=>!b.life);
  const rd=rest.filter(b=>b.status==='reading'),dn=rest.filter(b=>b.status==='done');
  const big=bigShelf(),lim=big&&!S.shelf.more?DONE_MAX:dn.length,dshow=S.shelf.doneOpen||!big?dn.slice(0,lim):[];
  const add='<button class="cover add" data-a="bookNew" aria-label="'+tr('새 책 추가')+'"><span class="cv"><span class="plusbig">+</span></span><span class="cvn">'+tr('새 책')+'</span></button>';
  const dh='<h3 class="sh plain" style="margin-top:28px"><span>'+tr('읽은 책 ')+dn.length+'</span>'+(big?'<button class="ib" data-a="doneToggle" aria-expanded="'+!!S.shelf.doneOpen+'" style="margin-left:8px">'+(S.shelf.doneOpen?tr('접기'):tr('펼치기'))+'</button>':'')+'</h3>';
  return (life.length?'<h3 class="sh plain"><span><b class="life-h">♥</b>'+tr(' 인생책 ')+life.length+'</span></h3><div class="shelfgrid" id="life-row">'+life.map(b=>coverHTML(b)).join('')+'</div>':'')+
    '<h3 class="sh plain"'+(life.length?' style="margin-top:28px"':'')+'><span>'+tr('읽는 중 ')+rd.length+'</span></h3><div class="shelfgrid">'+rd.map(b=>coverHTML(b)).join('')+add+'</div>'+
    (dn.length?dh+'<div class="shelfgrid">'+dshow.map(b=>coverHTML(b)).join('')+'</div>'+(big&&S.shelf.doneOpen&&dn.length>lim?'<div class="row" style="justify-content:center;margin-top:16px"><button class="ghostbtn" data-a="shelfMore">+'+(dn.length-lim)+tr('권 더 보기')+'</button></div>':''):'')+
    (!all.length?'<div class="card empty">'+tr('이 분야의 책이 없어요.')+'</div>':'');
}
function bookMatches(q){
  if(!q)return '';
  const l=D.books.filter(b=>(b.title+' '+b.author+' '+(b.publisher||'')).toLowerCase().indexOf(q.toLowerCase())>=0);
  return l.length?'<h3 class="sh plain" style="margin-bottom:12px"><span>'+tr('책 ')+l.length+'</span></h3><div class="shelfgrid" style="margin-bottom:26px">'+l.slice(0,24).map(b=>coverHTML(b)).join('')+'</div>':'';
}
function shelfDetail(b){
  const g=genreOf(b.genre),n=entriesOf(b.id).length,done=b.status==='done';
  const meta=[esc(b.author),b.publisher?esc(b.publisher):''].filter(Boolean).join(' · ');
  const desc=(norm(b.desc)||S.descEdit===b.id)?'<label class="label" for="bk-desc">'+tr('책 설명')+'</label><textarea id="bk-desc" class="field bkdesc" data-f="book.desc" data-id="'+b.id+'" placeholder="'+tr('이 책은 어떤 책인가요? 한두 줄로 소개해 두세요.')+'">'+esc(b.desc||'')+'</textarea>':'<button class="hint" data-a="descAdd" data-id="'+b.id+'" style="margin-top:8px">'+tr('+ 책 설명 추가하기')+'</button>';
  return '<section class="bkhead" style="'+bs(b)+'">'+coverHTML(b,true)+'<div class="bkinfo"><h2>'+esc(b.title)+'</h2><p class="soft">'+meta+'</p>'+

  mPrev:()=>{S.month.m--;if(S.month.m<1){S.month.m=12;S.month.y--;}render();},
  mNext:()=>{S.month.m++;if(S.month.m>12){S.month.m=1;S.month.y++;}render();},
  mToday:()=>{const d=parse(TODAY);S.month={y:d.getFullYear(),m:d.getMonth()+1};render();},
  wPrev:()=>{S.weekStart=addDays(S.weekStart,-7);render();},wNext:()=>{S.weekStart=addDays(S.weekStart,7);render();},wToday:()=>{S.weekStart=mondayOf(TODAY);render();},
  dPrev:()=>{S.day=addDays(S.day,-1);render();},dNext:()=>{S.day=addDays(S.day,1);render();},dToday:()=>{S.day=TODAY;render();},
  goDay:a=>{S.day=a.dataset.d;go('day');},
  goal:a=>{const g=D.goals[Number(a.dataset.i)];g.done=a.checked;save();render();},
  shelfBook:a=>{S.shelf.book=a.dataset.id;render();},
  shelfGenre:a=>{S.shelf.genre=a.dataset.id;S.shelf.more=false;render();},
  shelfMore:()=>{S.shelf.more=true;render();},
  doneToggle:()=>{S.shelf.doneOpen=!S.shelf.doneOpen;render();},
  shuffle:()=>{S.shelf.seed++;render();},
  qRefresh:()=>{S.qseed++;render();},
  copyQ:a=>{const e=D.entries.find(x=>x.id===a.dataset.id),b=bookById(e.bookId);copyText('> '+e.quote+' ('+b.title+', '+pgText(e)+', '+e.createdAt+(e.createdTime?' '+e.createdTime:'')+')'+(norm(e.thought)?'\n\n'+tr('내 생각: ')+e.thought:''),tr('인용구를 복사했어요'));},
  openEntry:a=>{const e=D.entries.find(x=>x.id===a.dataset.id),eb=bookById(e.bookId);
    if(eb.status==='done'){S.shelf.book=eb.id;S.shelf.q='';go('shelf');setTimeout(()=>{const n=document.getElementById('sc-'+e.id);if(n){n.scrollIntoView({block:'center'});n.style.outline='2px solid var(--ink)';setTimeout(()=>n.style.outline='',1600);}},60);return;}
    S.bookId=e.bookId;e.open=true;save();go('note');setTimeout(()=>{const n=document.getElementById('e-'+e.id);if(n){n.scrollIntoView({block:'center'});n.style.outline='2px solid var(--ink)';setTimeout(()=>n.style.outline='',1600);}},60);},
  wstar:a=>{const n=Number(a.dataset.n);D.weekStars[S.weekStart]=(D.weekStars[S.weekStart]===n)?0:n;save();render();},
  entryCancel:()=>{const sel=$('#e-book');if(sel&&sel.value==='__new'&&D.books.length){sel.value=sel.dataset.prev||sel.options[0].value;sel.dispatchEvent(new Event('change',{bubbles:true}));}else closeModal();},
  progToggle:()=>{S.progOpen=!S.progOpen;render();},
  bookToggle:()=>{S.bookOpen=!S.bookOpen;render();},
  moreBooks:()=>{S.moreBooks=!S.moreBooks;render();},
  showDone:()=>{S.showDone=!S.showDone;render();},
  bookDel:a=>{const b=bookById(a.dataset.id),n=entriesOf(b.id).length;openModal('<div class="modal card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+tr('이 책을 삭제할까요?')+'</h2><p>「'+esc(b.title)+tr('」과 남긴 기록 ')+n+tr('개가 함께 삭제돼요. 되돌릴 수 없어요.')+'</p><div class="actions"><button class="ghostbtn" data-a="modalClose">'+tr('취소')+'</button><button class="primary" data-a="bookDelOk" data-id="'+b.id+'">'+tr('삭제')+'</button></div></div>');},
  bookDelOk:a=>{const id=a.dataset.id;D.books=D.books.filter(b=>b.id!==id);D.entries=D.entries.filter(e=>e.bookId!==id);const nx=D.books.find(b=>b.status==='reading')||D.books[0];S.bookId=nx?nx.id:'';if(S.shelf.book===id)S.shelf.book='all';save();closeModal();render();toast(tr('책을 삭제했어요'));},
  lang:()=>{LANG=LANG==='en'?'ko':'en';try{localStorage.setItem('quote-lang',LANG);}catch(e){}render();},
  reorder:()=>{S.reorder=!S.reorder;render();},
  mvBook:a=>{const rd=D.books.filter(x=>x.status==='reading'),i=rd.findIndex(x=>x.id===a.dataset.id),j=i+Number(a.dataset.n);if(i<0||j<0||j>=rd.length)return;moveBook(rd[i].id,rd[j].id);},
  lifeToggle:a=>{const b=bookById(a.dataset.id);b.life=a.checked;save();render();toast(b.life?tr('인생책으로 표시했어요'):tr('인생책 표시를 풀었어요'));},
  lifeBtn:a=>{const b=bookById(a.dataset.id);b.life=!b.life;save();render();toast(b.life?tr('인생책으로 표시했어요'):tr('인생책 표시를 풀었어요'));},
  descAdd:a=>{S.descEdit=a.dataset.id;render();const n=$('#bk-desc');if(n)n.focus();},
  resetAsk:()=>openModal('<div class="modal card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+tr('샘플 데이터로 되돌릴까요?')+'</h2><p>'+tr('지금 저장된 책과 기록이 모두 사라지고 샘플 데이터로 바뀌어요.')+'</p><div class="actions"><button class="ghostbtn" data-a="modalClose">'+tr('취소')+'</button><button class="primary" data-a="reset">'+tr('되돌리기')+'</button></div></div>'),
  clearAsk:()=>openModal('<div class="modal card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+tr('모든 데이터를 지울까요?')+'</h2><p>'+tr('책과 기록, 메모가 모두 삭제돼요. 되돌릴 수 없어요.')+'</p><div class="actions"><button class="ghostbtn" data-a="modalClose">'+tr('취소')+'</button><button class="primary" data-a="clearAll">'+tr('모두 지우기')+'</button></div></div>'),
  modalClose:()=>closeModal(),
  scrim:(a,ev)=>{if(ev.target===a)closeModal();},
  copyMd:()=>copyText($('#md-out').value,tr('마크다운을 복사했어요')),
  reset:()=>{D=seed();_lg=null;S.bookId='b1';S.shelf.book='all';S.shelf.q='';S.reorder=false;setToday();save();closeModal();render();toast(tr('샘플 데이터로 되돌렸어요'));},
  clearAll:()=>{D=empty();_lg=null;S.bookId='';S.shelf.book='all';S.shelf.q='';S.reorder=false;setToday();save();closeModal();render();toast(tr('모든 데이터를 지웠어요'));}
};
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-a]');if(!a)return;const fn=A[a.dataset.a];if(fn){if(a.type!=='checkbox')ev.preventDefault&&a.tagName==='A'&&ev.preventDefault();fn(a,ev);}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.a==='goal'){A.goal(t);return;}
  if(t.id==='shelf-sort'){S.shelf.sort=t.value;render();return;}
  if(t.id==='shelf-bsort'){S.shelf.bsort=t.value;render();return;}
  if(t.id==='shelf-bsel'){S.shelf.book=t.value||'all';render();return;}
  if(t.id==='b-genre'){const c=colorFor(t.value),m=t.closest('form');if(m)m.setAttribute('style','--c:var(--'+c+');--cd:var(--'+c+'-d)');return;}
  const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='book.genre'){const b=bookById(t.dataset.id||S.bookId);b.genre=t.value;if(t.value)b.color=colorFor(t.value);save();render();return;}
  if(f==='book.title'||f==='book.author'||f==='book.publisher'||f==='book.started'||f==='book.reason'||f==='book.toc'){const b=bookById(S.bookId),k=f.split('.')[1];b[k]=t.value;save();if(k==='title'||k==='author'||k==='publisher')render();}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='shelf-q'){const before=bookMode();S.shelf.q=t.value;if(bookMode()!==before){render();return;}const es=shelfList(),q=norm(S.shelf.q);if($('#shelf-books'))$('#shelf-books').innerHTML=bookMatches(q);$('#shelf-cards').innerHTML=S.shelf.book!=='all'?shelfRows(es,q):shelfCards(es,q);$('#shelf-count').textContent=qn(es.length);return;}
  const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='entry.thought'){const e=D.entries.find(x=>x.id===t.dataset.id);e.thought=t.value;save();}
  else if(f==='memo'){D.memo=t.value;save();}
  else if(f==='book.memo'){bookById(S.bookId).memo=t.value;save();}
  else if(f==='weekgoal'){D.weekGoal[S.weekStart]=t.value;save();}
  else if(f==='book.reason'){bookById(S.bookId).reason=t.value;save();}
  else if(f==='book.desc'){bookById(t.dataset.id).desc=t.value;save();}
});
document.addEventListener('submit',ev=>{
  const f=ev.target,kind=f.dataset&&f.dataset.form;if(!kind)return;ev.preventDefault();
  if(kind==='goal'){const v=norm($('#goal-new').value);if(!v)return;D.goals.push({t:v,done:false});save();render();return;}
  if(kind==='book'){const title=norm($('#b-title').value);if(!title){$('#b-err').hidden=false;return;}
    const id=createBook({title,author:norm($('#b-author').value),publisher:norm($('#b-pub').value),genre:$('#b-genre').value,total:$('#b-total').value,reason:norm($('#b-reason').value),life:$('#b-life').checked});
    S.bookId=id;save();closeModal();go('note');toast(tr('책을 추가했어요'));return;}
  if(kind==='entry'){
    const err=$('#e-err');
    if($('#e-book').value==='__new'){
      const nt=norm($('#nb-title').value);
      if(!nt){err.textContent=tr('책 제목을 입력해 주세요.');err.hidden=false;$('#nb-title').focus();return;}
      const na=norm($('#nb-author').value),nid=createBook({title:nt,author:na,publisher:norm($('#nb-pub').value),genre:$('#nb-genre').value,total:$('#nb-total').value,reason:norm($('#nb-reason').value)});save();
      const sel=$('#e-book'),o=document.createElement('option');o.value=nid;o.textContent=nt+(na?' · '+na:'');sel.querySelector('optgroup').appendChild(o);
      sel.value=nid;['nb-title','nb-author','nb-pub','nb-reason'].forEach(i=>{$('#'+i).value='';});$('#nb-genre').value='';$('#nb-total').value=300;
      sel.dispatchEvent(new Event('change',{bubbles:true}));toast(tr('책을 추가했어요. 이어서 기록을 남겨요'));$('#e-page').focus();return;
    }
    const page=Number($('#e-page').value),mode=f.querySelector('input[name=mode]:checked').value,bid=$('#e-book').value,id=f.dataset.id,date=$('#e-date').value||TODAY,time=$('#e-time').value||nowHM();
    let quote,typed=false;
    if(mode==='copy'){quote=norm($('#e-orig').value);const t=$('#typed').value;let ok=0;for(let i=0;i<quote.length;i++)if(t[i]===quote[i])ok++;typed=!!quote&&t.length>=quote.length&&ok===quote.length;}
    else quote=norm($('#e-quote').value);
    if(!(page>=1)){err.textContent=tr('쪽수를 입력해 주세요.');err.hidden=false;$('#e-page').focus();return;}
    if(!quote){err.textContent=mode==='copy'?tr('원문을 붙여넣어 주세요.'):tr('인용구를 입력해 주세요.');err.hidden=false;return;}
    const bookId=bid,chapter=norm($('#e-chapter').value);
    const thought=$('#e-thought').value.trim();
    if(id){const e=D.entries.find(x=>x.id===id);e.typed=typed||(e.typed&&e.quote===quote);e.bookId=bookId;e.chapter=chapter;e.page=Math.round(page);e.quote=quote;e.thought=thought;e.createdAt=date;e.createdTime=time;}
    else{const min=D.entries.reduce((a,e)=>Math.min(a,e.order),1);D.entries.push({id:nextId(),bookId:bookId,chapter:chapter,page:Math.round(page),quote,thought,typed,star:false,open:true,createdAt:date,createdTime:time,order:min-1});}
    S.bookId=bookId;
    save();closeModal();if(S.view!=='note'&&S.view!=='day'&&S.view!=='week'&&S.view!=='shelf')go('note');else render();toast(id?tr('수정했어요'):tr('기록을 남겼어요'));
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-root').firstChild)closeModal();});

/* ---------- 시작 ---------- */
(function(){const r=$('#rings');let h='';for(let i=0;i<80;i++)h+='<span class="ring"></span>';r.innerHTML=h;})();
render();
})();
</script>
</body>
</html>
